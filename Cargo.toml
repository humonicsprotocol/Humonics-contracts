[workspace]
resolver = "2"
members = [
    "contracts/certificate_registry",
    "contracts/verification_gateway", 
    "contracts/hum_token",
    "contracts/humonics-shared",
]

[workspace.dependencies]
soroban-sdk = "21.7.7"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
